<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李姣 · 生日快乐</title>
    <style>
        /* 全局重置与基础 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: '方正姚体', 'PingFang SC', 'Microsoft YaHei', serif;
            background-color: #0a0a1a;
            color: #eaeaea;
            overflow-x: hidden;
        }

        /* 平滑滚动与渐入动画 */
        html {
            scroll-behavior: smooth;
        }

        section {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 延迟动画，让内容依次出现 */
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.5s; }
        .delay-3 { animation-delay: 0.8s; }
        .delay-4 { animation-delay: 1.1s; }

        /* ====== 第一屏：英雄区 ====== */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(ellipse at 50% 80%, rgba(20, 40, 80, 0.6), #0a0a1a 80%);
            position: relative;
            padding: 0 20px;
        }

        /* 装饰性光晕 */
        .hero::after {
            content: '';
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            max-width: 800px;
            height: 60%;
            background: radial-gradient(ellipse, rgba(180, 150, 220, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        /* 英文名 - Freestyle Script */
        .name-en {
            font-family: 'Freestyle Script', 'Brush Script MT', cursive;
            font-size: clamp(3.5rem, 15vw, 8rem);
            font-weight: normal;
            color: #f0e6d0;
            text-shadow: 0 0 40px rgba(200, 180, 255, 0.15);
            letter-spacing: 0.05em;
            margin-bottom: -0.1em;
        }

        /* 中文名 - 方正姚体 */
        .name-zh {
            font-family: '方正姚体', 'STZhongsong', 'Microsoft YaHei', serif;
            font-size: clamp(2.8rem, 10vw, 5.5rem);
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.3em;
            margin-right: -0.3em; /* 修正字间距视觉 */
            text-shadow: 0 0 60px rgba(200, 180, 255, 0.2);
            margin-top: 0.1em;
        }

        .birthday-badge {
            margin-top: 2rem;
            padding: 0.6rem 2.2rem;
            border: 1px solid rgba(200, 180, 255, 0.25);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(4px);
            font-size: clamp(1rem, 3vw, 1.4rem);
            letter-spacing: 0.4em;
            color: #c8b4e6;
            display: inline-block;
        }

        .scroll-hint {
            position: absolute;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            animation: floatDown 2s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes floatDown {
            0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.3; }
            50% { transform: translateX(-50%) translateY(8px); opacity: 0.8; }
        }

        /* ====== 通用内容区 ====== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 24px;
        }

        .section-title {
            font-size: clamp(2rem, 5vw, 3rem);
            text-align: center;
            margin-bottom: 0.5rem;
            font-family: '方正姚体', 'STZhongsong', serif;
            letter-spacing: 0.15em;
            color: #f0e6d0;
        }

        .section-sub {
            text-align: center;
            color: #a09bb0;
            font-size: 1rem;
            letter-spacing: 0.3em;
            margin-bottom: 3rem;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #c8b4e6, transparent);
            margin: 0.8rem auto 2.5rem;
        }

        /* ====== 第二屏：照片画廊 ====== */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        .photo-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.6);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(2px);
        }

        .photo-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8);
            border-color: rgba(200, 180, 255, 0.15);
        }

        .photo-card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease;
        }

        .photo-card:hover img {
            transform: scale(1.03);
        }

        .photo-card .caption {
            padding: 16px 20px;
            font-size: 0.95rem;
            color: #c8c0d6;
            text-align: center;
            letter-spacing: 0.05em;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ====== 第三屏：祝福语 ====== */
        .bless-section {
            background: radial-gradient(ellipse at center, rgba(30, 20, 50, 0.5), transparent);
            padding: 60px 24px;
            margin: 40px 0;
            text-align: center;
            border-top: 1px solid rgba(200, 180, 255, 0.06);
            border-bottom: 1px solid rgba(200, 180, 255, 0.06);
        }

        .bless-text {
            max-width: 700px;
            margin: 0 auto;
            font-size: clamp(1.2rem, 3vw, 1.6rem);
            line-height: 2;
            color: #ddd6e8;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            letter-spacing: 0.06em;
            font-weight: 300;
        }

        .bless-text .highlight {
            color: #f0e6d0;
            font-weight: 400;
        }

        .bless-text .age {
            display: inline-block;
            font-family: 'Freestyle Script', cursive;
            font-size: 2.2rem;
            color: #c8b4e6;
            margin: 0 0.1em;
        }

        /* ====== 页脚 ====== */
        footer {
            text-align: center;
            padding: 40px 20px 30px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        footer span {
            color: rgba(200, 180, 255, 0.3);
        }

        /* ====== 响应式微调 ====== */
        @media (max-width: 600px) {
            .container { padding: 40px 16px; }
            .photo-grid { gap: 16px; }
            .photo-card img { height: 240px; }
            .bless-text { padding: 0 10px; }
        }
    </style>
</head>
<body>

    <!-- ==================== 第一屏：英雄区 ==================== -->
    <section class="hero">
        <div class="hero-content">
            <div class="name-en delay-1">Li Jiao</div>
            <div class="name-zh delay-2">李 姣</div>
            <div class="birthday-badge delay-3">✦ 二〇二六 · 廿六芳华 ✦</div>
        </div>
        <div class="scroll-hint">— 向下 · 探寻美好 —</div>
    </section>

    <!-- ==================== 第二屏：照片画廊 ==================== -->
    <section class="container delay-4">
        <h2 class="section-title">· 光影 ·</h2>
        <div class="divider"></div>
        <p class="section-sub">每一帧都是你独特的模样</p>

        <div class="photo-grid">
            <!-- ★★★ 重要：请将 src 替换为你实际的图片文件名 ★★★ -->
            <div class="photo-card">
                <img src="1.jpg" alt="李姣的生活照">
                <div class="caption">✨ 自在如风</div>
            </div>
            <div class="photo-card">
                <img src="2.jpg" alt="李姣的生活照">
                <div class="caption">🌸 温暖明媚</div>
            </div>
            <div class="photo-card">
                <img src="3.jpg" alt="李姣的生活照">
                <div class="caption">🌿 沉静有力</div>
            </div>
            <div class="photo-card">
                <img src="4.jpg" alt="李姣的生活照">
                <div class="caption">✨ 自在如风</div>
            </div>
            <div class="photo-card">
                <img src="5.jpg" alt="李姣的生活照">
                <div class="caption">✨ 自在如风</div>
            </div>
            <div class="photo-card">
                <img src="6.jpg" alt="李姣的生活照">
                <div class="caption">✨ 自在如风</div>
            </div>
            <!-- 如果你有更多照片，可以复制上面的卡片继续添加 -->
        </div>
    </section>

    <!-- ==================== 第三屏：祝福语 ==================== -->
    <section class="bless-section">
        <div class="container" style="padding: 0;">
            <h2 class="section-title" style="font-size: clamp(1.8rem, 4vw, 2.6rem);">· 爱的祝福 ·</h2>
            <div class="divider"></div>
            <div class="bless-text">
                <p>
                    亲爱的 <span class="highlight">李姣</span>，<br>
                    今天，世界为你点亮了第 <span class="age">26</span> 根蜡烛。<br>
                    愿你继续在自己的时区里，从容、舒展、光芒万丈。<br>
                    前路风新日暖，万物皆可期待。
                </p>
                <p style="margin-top: 2rem; font-size: 0.9rem; color: #a09bb0;">
                    —— 永远为你骄傲的朋友
                </p>
            </div>
        </div>
    </section>

    <!-- ==================== 页脚 ==================== -->
    <footer>
        <p>✦ 献给独一无二的李姣 ✦</p>
        <p style="margin-top: 8px; opacity: 0.5;">&copy; 2026 · 以爱之名</p>
    </footer>

</body>
</html>
